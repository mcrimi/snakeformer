name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked --group report

      - name: Lint
        run: uv run ruff check .

      - name: Python tests (rules against the terminal game, encodings, network, trainer, export)
        run: uv run pytest -q

      - name: Train a run end to end for a few steps
        run: uv run snakeformer train arrows-aligned --steps 20 --train-n 400 --out build/smoke

      - name: Export fresh test cases from the shipped weights
        run: uv run snakeformer fixtures

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript tests, including PyTorch-to-JS parity on the fresh export
        run: npm test

      - name: Syntax-check the page scripts
        run: for f in web/js/*.js; do node --check "$f"; done

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render the report from the committed results
        run: QUARTO_PYTHON="$PWD/.venv/bin/python" quarto render report/index.qmd

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            web
            report/index.html
